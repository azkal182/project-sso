services:
  postgres:
    image: postgres:16.4-alpine
    restart: always
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: always
    command: ["start"]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/bootstrap/bootstrap.sh"]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      KEYCLOAK_REALM_SSL_REQUIRED: "EXTERNAL"
      ACCOUNT_MANAGEMENT_REDIRECT_URI: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}/auth/callback
      ACCOUNT_MANAGEMENT_WEB_ORIGIN: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}
      ACCOUNT_MANAGEMENT_POST_LOGOUT_URI: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}/sign-in
    volumes:
      - ./infra/keycloak/bootstrap.sh:/opt/bootstrap/bootstrap.sh:ro
      - ./infra/keycloak/realm.json:/opt/bootstrap/realm.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

  account-db:
    image: postgres:16.4-alpine
    restart: always
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: account_management
      POSTGRES_USER: account_management
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    volumes:
      - account-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  account-management:
    image: project-sso-account-management:prod
    build: ./account-management
    restart: always
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://account_management:${ACCOUNT_DB_PASSWORD}@account-db:5432/account_management
      OIDC_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/pondok
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/pondok
      OIDC_CLIENT_ID: account-management
      OIDC_CLIENT_SECRET: ${ACCOUNT_MANAGEMENT_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}/auth/callback
      FRONTEND_URL: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}
      FRONTEND_ORIGINS: ${ACCOUNT_MANAGEMENT_PUBLIC_URL}
      KEYCLOAK_ADMIN_ISSUER: http://keycloak:8080/realms/pondok
      KEYCLOAK_ADMIN_CLIENT_ID: account-management-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${MANAGEMENT_CLIENT_SECRET}
    depends_on:
      account-db:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  reverse-proxy:
    image: nginx:1.27.1-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      keycloak:
        condition: service_healthy
      account-management:
        condition: service_started
      frontend:
        condition: service_started

  frontend:
    image: project-sso-frontend:prod
    build: ./frontend
    restart: always
    depends_on:
      account-management:
        condition: service_healthy

volumes:
  postgres-data:
  account-data:
